name: Fork build

# Fork-only entry point. Upstream `flutter-build.yml` is `workflow_call` only and
# `flutter-ci.yml` calls it with `upload-artifact: false`, so neither produces a
# downloadable Windows build. This exposes the same reusable workflow manually,
# with artifacts enabled.
#
# No signing secrets are required: every signing step in `flutter-build.yml` is
# gated on its secret being present, so a fork without `SIGN_BASE_URL`,
# `MACOS_P12_BASE64`, `ANDROID_SIGNING_KEY` or `RUSTDESK_UPDATE_ED25519_SEED`
# skips signing and uploads unsigned artifacts.
#
# Windows artifacts: rustdesk-unsigned-windows-x86_64 and NO-Installer-x64.

on:
  workflow_dispatch:

jobs:
  run-fork-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "fork"
      publish-update-metadata: false
