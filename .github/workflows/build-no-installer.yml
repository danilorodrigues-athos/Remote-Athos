name: Build NÓ installer

# Gera o Instalar-NO.exe a partir de um artefato Windows x64 já construído.
# O instalador é único, não assinado e inclui o payload do NÓ.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID com rustdesk-unsigned-windows-x86_64 (vazio = artefato mais recente)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  build-installer:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Resolve Windows artifact
        id: artifact
        shell: pwsh
        run: |
          $runId = "${{ inputs.run_id }}".Trim()
          if (-not $runId) {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=rustdesk-unsigned-windows-x86_64&per_page=100"
            $items = ($json | ConvertFrom-Json).artifacts |
              Where-Object { -not $_.expired } |
              Sort-Object created_at -Descending
            if (-not $items) {
              throw "Nenhum artefato rustdesk-unsigned-windows-x86_64 disponível."
            }
            $runId = [string]$items[0].workflow_run.id
          }
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          Write-Host "Run ID: $runId"

      - name: Download Windows app artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          gh run download "${{ steps.artifact.outputs.run_id }}" -R $env:GITHUB_REPOSITORY -n rustdesk-unsigned-windows-x86_64 -D payload
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao baixar o artefato Windows."
          }

      - name: Prepare installer payload
        id: payload
        shell: pwsh
        run: |
          $exe = Get-ChildItem payload -Recurse -Filter rustdesk.exe | Select-Object -First 1
          if (-not $exe) {
            throw "rustdesk.exe não encontrado no artefato."
          }
          $dir = $exe.Directory.FullName
          Rename-Item $exe.FullName 'NO.exe'
          Copy-Item 'res\installer\LEIA-ME-NO.md' $dir -Force
          Copy-Item 'res\installer\modelo-no-version.json' $dir -Force
          "payload_dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.2.2 --allow-downgrade --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao instalar o Inno Setup."
          }

      - name: Compile installer
        shell: pwsh
        run: |
          & .\res\installer\build-no-installer.ps1 `
            -PayloadDir "${{ steps.payload.outputs.payload_dir }}" `
            -OutputDir "$PWD\installer-output"

      - name: Verify installer
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'installer-output\Instalar-NO.exe'
          if (-not (Test-Path $out)) {
            throw "Instalador não gerado."
          }
          Get-Item $out | Select-Object FullName, Length, LastWriteTime | Format-List
          Get-FileHash $out -Algorithm SHA256 | Format-List
          $sig = Get-AuthenticodeSignature $out
          Write-Host "Assinatura: $($sig.Status)"

      - name: Smoke test installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD 'installer-output\Instalar-NO.exe'
          $appDir = Join-Path $env:ProgramFiles 'NO'
          $profileDir = Join-Path $env:APPDATA 'NO'
          $preserve = Join-Path $profileDir 'preserve-test.txt'

          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          Set-Content -Path $preserve -Value 'preservar' -Encoding UTF8

          $installLog = Join-Path $PWD 'installer-output\install.log'
          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$installLog" -PassThru
          if (-not $install.WaitForExit(120000)) {
            Write-Host '--- install.log (timeout) ---'
            Get-Content $installLog -Tail 200 -ErrorAction SilentlyContinue
            Get-Process -Name 'NO' -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, StartTime | Format-List
            Get-Service -Name 'NO' -ErrorAction SilentlyContinue | Format-List Name, Status
            if (-not $install.HasExited) {
              Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
            }
            throw 'Instalador não terminou em 120 segundos.'
          }
          if ($install.ExitCode -ne 0) {
            Get-Content $installLog -Tail 200 -ErrorAction SilentlyContinue
            throw "Instalador retornou $($install.ExitCode)."
          }
          if (-not (Test-Path (Join-Path $appDir 'NO.exe'))) {
            throw 'NO.exe não foi instalado em Program Files.'
          }

          $svc = $null
          for ($i = 0; $i -lt 15; $i++) {
            $svc = Get-Service -Name 'NO' -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') { break }
            Start-Sleep -Seconds 1
          }
          if (-not $svc -or $svc.Status -ne 'Running') {
            throw "Serviço NO não está em execução (status: $($svc.Status))."
          }

          foreach ($name in @('NO 21118 TCP', 'NO 21118 UDP')) {
            if (-not (Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue)) {
              throw "Regra de firewall ausente: $name"
            }
          }

          $entry = Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object { $_.DisplayName -eq 'NÓ - suporte remoto local' } |
            Select-Object -First 1
          if (-not $entry) {
            throw 'Entrada de desinstalação não registrada.'
          }

          if (-not (Test-Path (Join-Path $env:PUBLIC 'Desktop\NÓ.lnk'))) {
            throw 'Atalho da área de trabalho não criado.'
          }
          if (-not (Test-Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\NÓ.lnk'))) {
            throw 'Atalho do Menu Iniciar não criado.'
          }
          if (-not (Test-Path (Join-Path $env:TEMP 'NO-install.log'))) {
            throw 'Log da instalação não criado.'
          }

          $uninstaller = Join-Path $appDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) {
            throw 'Desinstalador não encontrado.'
          }
          $uninstallLog = Join-Path $PWD 'installer-output\uninstall.log'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$uninstallLog" -PassThru
          if (-not $uninstall.WaitForExit(120000)) {
            Get-Content $uninstallLog -Tail 200 -ErrorAction SilentlyContinue
            if (-not $uninstall.HasExited) {
              Stop-Process -Id $uninstall.Id -Force -ErrorAction SilentlyContinue
            }
            throw 'Desinstalador não terminou em 120 segundos.'
          }
          if ($uninstall.ExitCode -ne 0) {
            Get-Content $uninstallLog -Tail 200 -ErrorAction SilentlyContinue
            throw "Desinstalador retornou $($uninstall.ExitCode)."
          }

          if (Test-Path $appDir) {
            throw 'A pasta Program Files\NO não foi removida.'
          }
          if (-not (Test-Path $preserve)) {
            throw 'O perfil %APPDATA%\NO não foi preservado.'
          }
          if (Get-Service -Name 'NO' -ErrorAction SilentlyContinue) {
            throw 'O serviço NO não foi removido.'
          }
          foreach ($name in @('NO 21118 TCP', 'NO 21118 UDP')) {
            if (Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue) {
              throw "Regra de firewall não removida: $name"
            }
          }

          Remove-Item $profileDir -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'Smoke test do instalador: OK'

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NO-Installer-x64
          path: installer-output/Instalar-NO.exe
          if-no-files-found: error
          retention-days: 90
