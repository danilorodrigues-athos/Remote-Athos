name: Flutter Analyze

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Space separated Dart paths (relative to flutter/)"
        required: false
        default: "lib/desktop/pages/desktop_home_page.dart lib/desktop/pages/connection_page.dart lib/desktop/widgets/client_catalog.dart"

jobs:
  analyze:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.5"
          cache: true
      - run: flutter pub get
      - name: analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings ${{ inputs.paths }}
